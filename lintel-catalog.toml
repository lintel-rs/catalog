# :schema ./schemas/lintel/lintel-catalog-toml.json
[catalog]
title = "Lintel default schema catalog"

[target.default]
type = "dir"
dir = ".lintel-output/default"
base-url = "https://catalog.lintel.tools/"
github.cname = "catalog.lintel.tools"

[sources.schemastore]
url = "https://www.schemastore.org/api/json/catalog.json"

[sources.schemastore.organize.github]
match = ["**.github**"]

[sources.schemastore.organize.rust]
match = ["**Cargo.toml**", "**rustfmt**", "**rust-toolchain**"]

[groups.ads]
name = "Ads"
description = "Digital advertising specifications: sellers.json, ads.txt, and related IAB Tech Lab standards"

[groups.ads.schemas.sellers]
file-match = ["sellers.json", "**/sellers.json"]

[groups.claude-code]
name = "Claude Code"
description = "Schemas for Claude Code agent, skill, command, and plugin configuration files"

[groups.claude-code.schemas.agent]
file-match = ["**/.claude/agents/*.md", ".claude/agents/*.md"]

[groups.claude-code.schemas.command]
file-match = [
  "**/.claude/commands/*.md",
  ".claude/commands/*.md",
  "**/commands/*.md",
]

[groups.claude-code.schemas.marketplace]
file-match = [
  "**/.claude-plugin/marketplace.json",
  ".claude-plugin/marketplace.json",
]

[groups.claude-code.schemas.plugin]
file-match = ["**/.claude-plugin/plugin.json", ".claude-plugin/plugin.json"]

[groups.claude-code.schemas.skill]
file-match = ["**/skills/*/SKILL.md", "**/skills/*.md", ".claude/skills/*.md"]

[groups.devenv]
name = "devenv"
description = "Nix-based development environment configuration"

[groups.devenv.schemas.devenv]
url = "https://devenv.sh/devenv.schema.json"
name = "devenv.yaml"
description = "devenv configuration file"
file-match = ["devenv.yaml", "**/devenv.yaml"]

[groups.github]
name = "GitHub"
description = "GitHub Actions workflows, Dependabot, issue templates, and other GitHub configuration files"

[groups.kysely]
name = "Kysely"
description = "Kysely SQL query builder tooling and code generation"

[groups.kysely.schemas.kysely-codegen]
file-match = [".kysely-codegenrc.json", "**/.kysely-codegenrc.json"]

[groups.lintel]
name = "Lintel"
description = "Lintel configuration files"

[groups.lintel.schemas.lintel-toml]
file-match = ["lintel.toml", "**/lintel.toml"]

[groups.lintel.schemas.lintel-catalog-toml]
file-match = ["lintel-catalog.toml", "**/lintel-catalog.toml"]

[groups.lintel.schemas.catalog]
file-match = ["catalog.json", "**/catalog.json"]

[groups.rust]
name = "Rust"
description = "Rust toolchain configuration: Cargo, Clippy, rustfmt, and rust-toolchain"

[groups.rust.schemas.clippy]
file-match = [
  "clippy.toml",
  ".clippy.toml",
  "**/clippy.toml",
  "**/.clippy.toml",
]
