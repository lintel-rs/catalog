# :schema ./schemas/lintel/lintel-catalog-toml.json

[catalog]
title = "Lintel Catalog"

[target.default]
type = "dir"
dir = ".lintel-output/default"
base-url = "https://catalog.lintel.tools/"

[target.default.site]
description = "The default schema catalog for Lintel, the multi-format JSON Schema linter for all your config files."
github.cname = "catalog.lintel.tools"

[sources.schemastore]
url = "https://www.schemastore.org/api/json/catalog.json"
exclude-matches = ["biome.jsonc"]

[sources.schemastore.organize.github]
match = ["**.github**"]

[sources.schemastore.organize.rust]
match = ["**Cargo.toml**", "**rustfmt**", "**rust-toolchain**"]

[sources.schemastore.organize.ast-grep]
match = ["**sgconfig**", "**astgrep**", "**ast-grep**"]

[sources.schemastore.organize.biome]
match = ["biome.json", "biome.jsonc"]

[sources.schemastore.organize.typescript]
match = ["**tsconfig**"]

[groups.ads]
name = "Ads"
description = "IAB Tech Lab digital advertising specifications"

[groups.ads.schemas.sellers]
description = "IAB Tech Lab sellers.json supply chain transparency file"
file-match = ["sellers.json", "**/sellers.json"]

[groups.biome.schemas.biome]
description = "Biome configuration file"
file-match = ["biome.json", "biome.jsonc", "**/biome.json", "**/biome.jsonc"]
url = "https://biomejs.dev/schemas/latest/schema.json"

