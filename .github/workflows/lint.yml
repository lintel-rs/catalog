name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: devenv test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: lintel
          extraPullNames: devenv
      - run: nix profile install nixpkgs#devenv
      - run: devenv test
